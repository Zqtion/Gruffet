[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gruffet"
version = "0.1.0"
description = "Free, keyless, cross-checked lead generation and market research for coding agents (Claude Code, Codex, Cursor, Antigravity)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "dnspython>=2.6",
  "openpyxl>=3.1",
  "phonenumbers>=8.13",
  "rapidfuzz>=3.6",
  "tldextract>=5.1",
  "Pillow>=10.0",
]

[project.optional-dependencies]
# JS-heavy sites: renders pages with Crawl4AI's Playwright browser.
browser = ["crawl4ai>=0.7"]
dev = ["pytest>=8"]

[project.scripts]
gruffet = "gruffet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gruffet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/Zqtion/Gruffet"
Issues = "https://github.com/Zqtion/Gruffet/issues"
