<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 330" role="img" aria-labelledby="title desc">
<title id="title">Gruffet research workflow</title>
<desc id="desc">Illustration of the workflow: discover public businesses, check published evidence, review uncertainties, and export structured research. An illustration, not a live result or accuracy benchmark.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171d1b"/><stop offset="1" stop-color="#0b1211"/></linearGradient>
  <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#f4cf7f"/><stop offset="1" stop-color="#e9ad39"/></linearGradient>
</defs>
<rect width="1160" height="330" rx="23" fill="url(#bg)"/>
<g stroke="#30403b" stroke-width="1" opacity=".48">
  <path d="M0 66H1160M0 132H1160M0 198H1160M0 264H1160M80 0V330M160 0V330M240 0V330M320 0V330M400 0V330M480 0V330M560 0V330M640 0V330M720 0V330M800 0V330M880 0V330M960 0V330M1040 0V330M1120 0V330"/>
</g>
<rect x="34" y="32" width="38" height="38" rx="10" fill="#efb949"/>
<text x="46" y="59" fill="#111716" font-family="Arial,sans-serif" font-size="25" font-weight="800">G</text>
<text x="84" y="59" fill="#f9f1de" font-family="Arial,sans-serif" font-size="21" font-weight="800" letter-spacing="3">GRUFFET</text>
<text x="34" y="122" fill="#f9f1de" font-family="Arial,sans-serif" font-size="39" font-weight="800">From public pages to</text>
<text x="34" y="169" fill="url(#gold)" font-family="Arial,sans-serif" font-size="39" font-weight="800">research you can inspect.</text>
<text x="36" y="208" fill="#aabcb6" font-family="Arial,sans-serif" font-size="17">Local-first  ·  Open source  ·  Evidence-aware</text>
<g font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">
  <rect x="34" y="244" width="180" height="54" rx="13" fill="#233a34" stroke="#587a6e"/>
  <text x="124" y="277" fill="#cdeadd">01  DISCOVER</text>
  <path d="M221 271h22m-7-7 7 7-7 7" fill="none" stroke="#91ad9d" stroke-width="2"/>
  <rect x="251" y="244" width="180" height="54" rx="13" fill="#233a34" stroke="#587a6e"/>
  <text x="341" y="277" fill="#cdeadd">02  CHECK</text>
  <path d="M438 271h22m-7-7 7 7-7 7" fill="none" stroke="#91ad9d" stroke-width="2"/>
  <rect x="468" y="244" width="180" height="54" rx="13" fill="#233a34" stroke="#587a6e"/>
  <text x="558" y="277" fill="#cdeadd">03  REVIEW</text>
  <path d="M655 271h22m-7-7 7 7-7 7" fill="none" stroke="#91ad9d" stroke-width="2"/>
  <rect x="685" y="244" width="180" height="54" rx="13" fill="#eebc57"/>
  <text x="775" y="277" fill="#17211e">04  EXPORT</text>
</g>
<g transform="translate(917,85)">
